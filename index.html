<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual INFIX® - Configuratore & Preventivatore Tecnico</title>
  <style>
    :root {
      --primary-color: #004070;
      --accent-color: #4CAF50;
      --bg-color: #f4f7f9;
      --text-color: #333;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 30px;
    }
    
    .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
    .header img { max-width: 180px; height: auto; display: block; margin: 0 auto 15px auto; border-radius: 6px; }
    .header h1 { color: var(--primary-color); font-size: 28px; font-weight: 800; }
    .header p { color: #666; font-size: 15px; margin-top: 5px; }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--primary-color); }
    select, input[type="text"], input[type="email"], input[type="tel"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      background-color: #fafafa;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--primary-color); outline: none; background: #fff; }

    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
    @media (max-width: 768px) { .grid-3 { grid-template-columns: 1fr; } }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

    #customSpecGroup { display: none; margin-top: 10px; }

    /* Upload Photo & Multi Preview */
    .file-upload-box {
      border: 2px dashed #bbb;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background-color: #f9f9f9;
      cursor: pointer;
    }
    .file-upload-box:hover { border-color: var(--primary-color); background: #f0f7ff; }
    #photoInput { display: none; }
    
    #previewContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }
    .preview-thumb {
      position: relative;
      width: 90px;
      height: 90px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #ddd;
    }
    .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #555;
    }
    .checkbox-group input { margin-top: 4px; cursor: pointer; }

    .btn-submit {
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-submit:hover { background-color: #45a049; }

    #statusMessage {
      display: none;
      padding: 15px;
      margin-top: 20px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
    }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <!-- Logo Bussola INFIX Formattato -->
      <img src="bussola-infix-marchio-figurativo-momento di intervenire.jpg" alt="Bussola INFIX Logo">
      <h1>VISUAL INFIX®</h1>
      <p>Configuratore Visivo & Scheda Tecnica Preventivo</p>
    </div>

    <form id="visualInfixForm">
      
      <!-- STEP 1: Macro Categoria -->
      <div class="form-group">
        <label for="categorySelect">1. Seleziona la Categoria di Prodotto</label>
        <select id="categorySelect" required onchange="updateSubCategories()">
          <option value="">-- Seleziona Categoria --</option>
          <option value="serramenti">Infissi e Serramenti (Legno, PVC, Alluminio)</option>
          <option value="blindate">Porte Blindate e Portoncini</option>
          <option value="interne">Porte Interne e Design</option>
          <option value="oscuranti">Persiane, Scuri e Oscuranti</option>
          <option value="cassonetti">Cassonetti Coibentati</option>
          <option value="sezionali">Portoni Sezionali e Basculanti</option>
        </select>
      </div>

      <!-- STEP 2, 3 & 4: Sottomenu Dinamici + Specifiche Colore/Materiale con opzione Altro -->
      <div class="grid-3">
        <div class="form-group">
          <label for="subCategorySelect">2. Tipologia / Materiale</label>
          <select id="subCategorySelect" required onchange="updateSpecifications()">
            <option value="">-- Prima seleziona cat. --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="specSelect">3. Finitura / Colore / Essenza</label>
          <select id="specSelect" required onchange="checkCustomSpec(this)">
            <option value="">-- Prima seleziona tipologia --</option>
          </select>
          <!-- Campo di testo libero che appare se selezionano l'opzione Altro -->
          <div id="customSpecGroup">
            <input type="text" id="customSpecInput" placeholder="Indica il colore o essenza desiderata...">
          </div>
        </div>

        <div class="form-group">
          <label for="diagnosisSelect">4. Esigenza / Problema</label>
          <select id="diagnosisSelect" required>
            <option value="">-- Prima seleziona cat. --</option>
          </select>
        </div>
      </div>

      <!-- STEP 5: Indirizzo Cantiere -->
      <div class="form-group">
        <label for="userAddress">5. Indirizzo del Cantiere / Località dell'Intervento</label>
        <input type="text" id="userAddress" placeholder="Via Roma 10, Città (Provincia)" required>
      </div>

      <!-- STEP 6: Upload Foto Multiple -->
      <div class="form-group">
        <label>6. Foto dello Stato Attuale (Puoi caricarne anche più di una)</label>
        <div class="file-upload-box" onclick="document.getElementById('photoInput').click()">
          <p>📷 <strong>Clicca qui per caricare o scattare le foto</strong></p>
          <span style="font-size:12px; color:#777;">Formati accettati: JPG, PNG (Opzionale)</span>
        </div>
        <input type="file" id="photoInput" accept="image/*" multiple onchange="handleImagePreviews(event)">
        
        <div id="previewContainer"></div>
      </div>

      <!-- STEP 7: Note -->
      <div class="form-group">
        <label for="userNotes">7. Note e Preferenze (Vetro acustico, ferramenta antieffrazione, ecc.)</label>
        <textarea id="userNotes" rows="3" placeholder="Es. Cerco triplo vetro fonoassorbente..."></textarea>
      </div>

      <!-- STEP 8: Contatti -->
      <div class="grid-2">
        <div class="form-group">
          <label for="userName">Nome e Cognome / Azienda</label>
          <input type="text" id="userName" placeholder="Mario Rossi" required>
        </div>
        <div class="form-group">
          <label for="userPhone">Telefono / WhatsApp</label>
          <input type="tel" id="userPhone" placeholder="333 1234567" required>
        </div>
      </div>

      <div class="form-group">
        <label for="userEmail">Email per la risposta</label>
        <input type="email" id="userEmail" placeholder="mario.rossi@email.it" required>
      </div>

      <!-- GDPR -->
      <div class="checkbox-group">
        <input type="checkbox" id="privacyCheck" required>
        <label for="privacyCheck" style="display:inline; font-weight:normal; color:#555;">
          Acconsento al trattamento dei dati personali ai sensi del Regolamento UE 2016/679 (GDPR) per la ricezione del preventivo.*
        </label>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">INVIA RICHIESTA INFIX®</button>
    </form>

    <div id="statusMessage"></div>
  </div>

  <script>
    const optionsData = {
      serramenti: {
        types: [
          { name: "PVC ad Alto Isolamento", specs: ["Bianco Massa / Effetto Legno", "Grigio Antracite RAL 7016", "Effetto Rovere Chiaro / Scuro", "Bicolore (Interno Bianco / Esterno Colore)", "Altro (Specifica un colore o essenza personalizzata)"] },
          { name: "Legno-Alluminio", specs: ["Rovere Naturale / Spazzolato", "Pino Laccato Bianco", "Noce / Castagno", "Alluminio Esterno Ral Personalizzato", "Altro (Specifica un colore o essenza personalizzata)"] },
          { name: "Alluminio a Taglio Termico", specs: ["Verniciato RAL Standard Opaco", "Effetto Legno Sublimato", "Ossidato / Anodizzato Argento o Bronzo", "Altro (Specifica un colore o essenza personalizzata)"] },
          { name: "Legno Naturale", specs: ["Rovere Sfumato", "Pino di Svezia", "Frassino / Lario", "Altro (Specifica un colore o essenza personalizzata)"] }
        ],
        diagnosis: ["Spifferi e Condensa persistente", "Dispersioni termiche elevate", "Scarsità di isolamento acustico", "Degrado meccanico / Difficoltà apertura"]
      },
      blindate: {
        types: [
          { name: "Porta Blindata Classe 3", specs: ["Pannello Liscio Laminato", "Pannello Pantografato Legno", "Pannello Alluminio per Esterno", "Altro (Specifica un colore o essenza personalizzata)"] },
          { name: "Porta Blindata Classe 4", specs: ["Finitura coordinata condominiale", "Pannello Massello Rovere", "Alluminio Antigrandine/Sole", "Altro (Specifica un colore o essenza personalizzata)"] },
          { name: "Portoncino d'Ingresso Alluminio/Legno", specs: ["Vetro laterale satinato", "Design moderno con inserti inox", "Altro (Specifica un colore o essenza personalizzata)"] }
        ],
        diagnosis: ["Sicurezza e Serratura obsoleta", "Usura e Perdita di tenuta d'aria", "Richiesta Restyling Estetico"]
      },
      interne: {
        types: [
          { name: "Battente Laccato / Essenza", specs: ["Laccato Bianco Opaco / Lucido", "Essenza Rovere Naturale", "Finitura Spazzolata a Poro Aperto", "Altro (Specifica un colore o essenza personalizzata)"] },
          { name: "Scorrevole Incasso (Scrigno)", specs: ["Legno Cieco", "Vetro Trasparente / Satinato con Cornice", "Altro (Specifica un colore o essenza personalizzata)"] },
          { name: "Scorrevole Esterno Muro", specs: ["Binario di Design Alluminio", "Porta in Vetro Temperato Decorato", "Altro (Specifica un colore o essenza personalizzata)"] },
          { name: "Vetro e Alluminio Design", specs: ["Vetro Fumè con Profili Neri", "Vetro Extrachiaro", "Altro (Specifica un colore o essenza personalizzata)"] }
        ],
        diagnosis: ["Degrado Meccanico / Usura", "Stile Fuori Mercato", "Isolamento Acustico Nullo tra Ambienti"]
      },
      oscuranti: {
        types: [
          { name: "Persiane Alluminio / PVC", specs: ["A stecca orientabile", "A stecca fissa cieca", "Verde / Marrone / Antracite RAL", "Altro (Specifica un colore o essenza personalizzata)"] },
          { name: "Scuri in Legno / Alluminio", specs: ["Modello Veneziano a doghe", "Modello Padovano / Vicentino", "Altro (Specifica un colore o essenza personalizzata)"] },
          { name: "Tapparelle Avvolgibili Coibentate", specs: ["Alluminio alta densità", "Acciaio antieffrazione", "Altro (Specifica un colore o essenza personalizzata)"] }
        ],
        diagnosis: ["Sbiadimento Irreversibile", "Costi di manutenzione troppo elevati", "Usura Meccanica Guide/Rulli"]
      },
      cassonetti: {
        types: [
          { name: "Cassonetto Coibentato Monoblocco", specs: ["Finitura bianca standard da tinteggiare", "Rivestimento coordinato al infisso", "Altro (Specifica un colore o essenza personalizzata)"] },
          { name: "Isolamento Cassonetto Esistente (Renova)", specs: ["Kit termico interno invisibile"] }
        ],
        diagnosis: ["Ponte Termico e Bucate da Aria", "Rumore esterno dal Cassonetto", "Spifferi perimetrali"]
      },
      sezionali: {
        types: [
          { name: "Portone Sezionale Coibentato", specs: ["Pannello dogato bianco/antracite", "Effetto legno scuro con oblò", "Altro (Specifica un colore o essenza personalizzata)"] },
          { name: "Basculante di Sicurezza Motore", specs: ["Lamiera verniciata goffrata", "Snodo semiautomatico", "Altro (Specifica un colore o essenza personalizzata)"] }
        ],
        diagnosis: ["Mancanza di isolamento nel Garage", "Richiesta Apertura Automatica/Smart", "Usura Molle e Cavi"]
      }
    };

    let collectedImages = [];

    function updateSubCategories() {
      const cat = document.getElementById('categorySelect').value;
      const subSelect = document.getElementById('subCategorySelect');
      const specSelect = document.getElementById('specSelect');
      const diagSelect = document.getElementById('diagnosisSelect');

      subSelect.innerHTML = '<option value="">-- Seleziona Tipologia --</option>';
      specSelect.innerHTML = '<option value="">-- Prima seleziona tipologia --</option>';
      diagSelect.innerHTML = '<option value="">-- Seleziona Diagnosi --</option>';
      document.getElementById('customSpecGroup').style.display = 'none';

      if (cat && optionsData[cat]) {
        optionsData[cat].types.forEach(t => {
          subSelect.innerHTML += `<option value="${t.name}">${t.name}</option>`;
        });
        optionsData[cat].diagnosis.forEach(d => {
          diagSelect.innerHTML += `<option value="${d}">${d}</option>`;
        });
      }
    }

    function updateSpecifications() {
      const cat = document.getElementById('categorySelect').value;
      const subName = document.getElementById('subCategorySelect').value;
      const specSelect = document.getElementById('specSelect');

      specSelect.innerHTML = '<option value="">-- Seleziona Finitura / Colore --</option>';
      document.getElementById('customSpecGroup').style.display = 'none';

      if (cat && subName && optionsData[cat]) {
        const foundType = optionsData[cat].types.find(t => t.name === subName);
        if (foundType && foundType.specs) {
          foundType.specs.forEach(s => {
            specSelect.innerHTML += `<option value="${s}">${s}</option>`;
          });
        }
      }
    }

    function checkCustomSpec(selectObj) {
      const customGroup = document.getElementById('customSpecGroup');
      if (selectObj.value.includes("Altro")) {
        customGroup.style.display = 'block';
        document.getElementById('customSpecInput').focus();
      } else {
        customGroup.style.display = 'none';
        document.getElementById('customSpecInput').value = '';
      }
    }

    function handleImagePreviews(event) {
      const files = event.target.files;
      const previewContainer = document.getElementById('previewContainer');
      previewContainer.innerHTML = '';
      collectedImages = [];

      if (files) {
        Array.from(files).forEach(file => {
          const reader = new FileReader();
          reader.onload = function(e) {
            collectedImages.push(e.target.result);
            const thumb = document.createElement('div');
            thumb.className = 'preview-thumb';
            thumb.innerHTML = `<img src="${e.target.result}" alt="Anteprima">`;
            previewContainer.appendChild(thumb);
          }
          reader.readAsDataURL(file);
        });
      }
    }

    document.getElementById('visualInfixForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMessage');
      
      submitBtn.disabled = true;
      submitBtn.innerText = "Invio in corso...";
      statusMsg.style.display = 'none';

      // Se l'utente seleziona la voce "Altro", inviamo la specifica personalizzata
      let finalSpec = document.getElementById('specSelect').value;
      if (finalSpec.includes("Altro")) {
        const customText = document.getElementById('customSpecInput').value.trim();
        if (customText) {
          finalSpec = `Personalizzato: ${customText}`;
        }
      }

      const formData = {
        category: document.getElementById('categorySelect').options[document.getElementById('categorySelect').selectedIndex].text,
        subCategory: document.getElementById('subCategorySelect').value,
        specification: finalSpec,
        diagnosis: document.getElementById('diagnosisSelect').value,
        address: document.getElementById('userAddress').value,
        notes: document.getElementById('userNotes').value,
        name: document.getElementById('userName').value,
        phone: document.getElementById('userPhone').value,
        email: document.getElementById('userEmail').value,
        image: collectedImages.length > 0 ? collectedImages[0] : null
      };

      try {
        const response = await fetch('https://configuratore-visual-infix.onrender.com/api/send-visual-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        if (response.ok) {
          statusMsg.className = 'success';
          statusMsg.innerText = '✅ Richiesta inviata con successo! Verrai reindirizzato al sito INFIX®...';
          statusMsg.style.display = 'block';

          setTimeout(() => {
            window.location.href = 'https://www.infix.it';
          }, 3000);

        } else {
          throw new Error('Errore durante l\'invio');
        }
      } catch (err) {
        statusMsg.className = 'error';
        statusMsg.innerText = '❌ Si è verificato un errore durante l\'invio. Riprova o contattaci via WhatsApp.';
        statusMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = "INVIA RICHIESTA INFIX®";
      }
    });
  </script>
</body>
</html>
